{% extends 'base.html' %}

{% block content %}
<!-- Full Page Background -->
<section style="min-height: 100vh; display: flex; justify-content: center; align-items: center; background: linear-gradient(135deg, #0078D7, #00B4D8); padding: 40px;">

    <!-- Profile Card -->
    <div style="background: #ffffff; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.25); width: 100%; max-width: 550px; padding: 40px 45px; border: 3px solid #0078D7; transition: all 0.3s ease;">
        
        <!-- Profile Header -->
        <div style="text-align: center; margin-bottom: 30px;">
            <div style="display: inline-block; border: 5px solid #0078D7; border-radius: 50%; padding: 5px;">
                {% if user.profile.profile_pic %}
                    <img src="{{ user.profile.profile_pic.url }}" 
                         class="rounded-circle" width="120" height="120" alt="Profile Picture">
                {% else %}
                    <img src="https://via.placeholder.com/120" 
                         class="rounded-circle" alt="Profile Picture">
                {% endif %}
            </div>
            <h3 style="margin-top: 15px; color: #0078D7; font-weight: bold;">{{ user.first_name }} {{ user.last_name }}</h3>
            <p style="color: #666;">{{ user.email }}</p>
            <hr style="margin-top: 25px;">
        </div>

        <!-- Profile Form -->
        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            <!-- Personal Info Section -->
            <div style="margin-bottom: 25px;">
                <h5 style="color: #0078D7; border-left: 4px solid #0078D7; padding-left: 10px;">Personal Information</h5>
                <div style="margin-top: 15px;">
                    {{ user_form.as_p }}
                </div>
            </div>

            <!-- Contact Info Section -->
            <div style="margin-bottom: 25px;">
                <h5 style="color: #0078D7; border-left: 4px solid #0078D7; padding-left: 10px;">Contact Information</h5>
                <div style="margin-top: 15px;">
                    {{ profile_form.as_p }}
                </div>
            </div>

            <!-- Update Button -->
            <button type="submit" 
                    style="width: 100%; background: #0078D7; color: white; border: none; padding: 12px; 
                           font-size: 1.1rem; font-weight: bold; border-radius: 10px; 
                           transition: all 0.3s ease; cursor: pointer;">
                Update Profile
            </button>
        </form>
    </div>
</section>

<!-- Extra Styling -->
<style>
    /* Card hover animation */
    div[style*="max-width: 550px"]:hover {
        transform: translateY(-5px);
        box-shadow: 0 15px 30px rgba(0, 120, 215, 0.4);
    }

    /* Form Inputs */
    input, select, textarea {
        border-radius: 6px !important;
        border: 1px solid #ccc !important;
        padding: 8px !important;
        width: 100%;
        transition: all 0.2s ease;
    }

    input:focus, select:focus, textarea:focus {
        border-color: #0078D7 !important;
        box-shadow: 0 0 6px rgba(0, 120, 215, 0.3);
        outline: none;
    }

    button:hover {
        background: white !important;
        color: #0078D7 !important;
        border: 2px solid #0078D7 !important;
    }
</style>
{% endblock %}
