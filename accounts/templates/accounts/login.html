{% extends 'base.html' %}

{% block content %}
<section style="display: flex; justify-content: center; align-items: center; min-height: 90vh; background: linear-gradient(135deg, #0078D7, #00B4D8); padding: 40px;">
  <div style="background: white; padding: 40px 50px; border-radius: 15px; box-shadow: 0 8px 20px rgba(0,0,0,0.2); width: 100%; max-width: 400px; text-align: center;">
    
    <h2 style="margin-bottom: 25px; color: #0078D7;">🔐 Login to Your Account</h2>
    
    <form method="POST" style="text-align: left;">
      {% csrf_token %}
      
      <label for="username" style="font-weight: bold; display: block; margin-bottom: 8px;">Username</label>
      <input type="text" name="username" id="username" required 
             style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 20px; font-size: 1rem;">

      <label for="password" style="font-weight: bold; display: block; margin-bottom: 8px;">Password</label>
      <input type="password" name="password" id="password" required 
             style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; margin-bottom: 25px; font-size: 1rem;">
      
      <button type="submit" 
              style="width: 100%; background: #0078D7; color: white; padding: 12px; border: none; border-radius: 8px; 
                     font-size: 1.1rem; font-weight: bold; cursor: pointer; transition: background 0.3s ease;">
        Login
      </button>
    </form>

    <p style="margin-top: 20px; font-size: 0.95rem;">
      Don’t have an account? 
      <a href="{% url 'signup' %}" style="color: #0078D7; font-weight: bold; text-decoration: none;">Sign Up</a>
    </p>
  </div>
</section>
{% endblock %}
