{% extends 'base.html' %}
{% block content %}
<section style="min-height: 100vh; display: flex; justify-content: center; align-items: center; background: linear-gradient(135deg, #0078D7, #00B4D8); padding: 40px;">
  <div style="background: #fff; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.25); width: 100%; max-width: 500px; padding: 40px; border: 3px solid #0078D7;">
    
    <div style="text-align: center; margin-bottom: 25px;">
      <h2 style="color: #0078D7; font-weight: bold;">🧾 Create Your Account</h2>
      <p style="color: #666;">Join us and enjoy our premium home cleaning services.</p>
      <hr style="margin-top: 20px;">
    </div>

    {% if messages %}
      {% for message in messages %}
        <div style="background: {% if message.tags == 'error' %}#ffcccc{% else %}#ccffcc{% endif %};
                    padding: 10px; border-radius: 6px; color: #333; margin-bottom: 10px;">
          {{ message }}
        </div>
      {% endfor %}
    {% endif %}

    <form method="POST">
      {% csrf_token %}
      
      <label style="font-weight: bold;">Username</label>
      <input type="text" name="username" required 
             style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc; margin-bottom: 18px;">

      <label style="font-weight: bold;">Email</label>
      <input type="email" name="email" required 
             style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc; margin-bottom: 18px;">

      <label style="font-weight: bold;">Password</label>
      <input type="password" name="password1" required 
             style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc; margin-bottom: 18px;">

      <label style="font-weight: bold;">Confirm Password</label>
      <input type="password" name="password2" required 
             style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc; margin-bottom: 25px;">

      <label style="font-weight: bold;">Account Type</label>
      <select name="role" required 
              style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc; margin-bottom: 25px;">
        <option value="customer">Customer (Service Taker)</option>
        <option value="provider">Service Provider</option>
      </select>

      <button type="submit" 
              style="width: 100%; background: #0078D7; color: white; font-weight: bold; 
                     border: none; border-radius: 10px; padding: 12px; font-size: 1.1rem; 
                     cursor: pointer; transition: all 0.3s ease;">
        Sign Up
      </button>
    </form>

    <p style="margin-top: 20px; text-align: center; font-size: 0.95rem;">
      Already have an account? 
      <a href="{% url 'login' %}" style="color: #0078D7; font-weight: bold; text-decoration: none;">Login</a>
    </p>
  </div>
</section>
{% endblock %}
