{% extends 'base.html' %}
{% block content %}

<section style="min-height: 100vh; background: linear-gradient(135deg, #0078D7, #00B4D8); padding: 40px 20px;">
  <div style="max-width: 600px; margin: 0 auto; background: white; border-radius: 20px; padding: 40px; box-shadow: 0 10px 25px rgba(0,0,0,0.25); border: 3px solid #0078D7;">

    <h2 style="text-align: center; color: #0078D7; font-weight: bold; margin-bottom: 25px;">⭐ Rate Your Experience</h2>

    <div style="background: #f9f9f9; padding: 15px; border-radius: 10px; margin-bottom: 20px;">
      <p style="margin: 5px 0;"><strong>Service:</strong> {{ booking.service.name }}</p>
      <p style="margin: 5px 0;"><strong>Booking Date:</strong> {{ booking.date }} at {{ booking.time }}</p>
    </div>

    <form method="POST" style="margin-top: 20px;">
      {% csrf_token %}
      
      <div style="margin-bottom: 20px;">
        <label style="font-weight: bold; display: block; margin-bottom: 10px;">How was the service?</label>
        {% for value, label in form.rating.field.choices %}
          <div style="margin-bottom: 10px;">
            <input type="radio" id="rating_{{ value }}" name="rating" value="{{ value }}" required>
            <label for="rating_{{ value }}" style="margin-left: 8px; cursor: pointer;">{{ label }}</label>
          </div>
        {% endfor %}
      </div>

      <div style="margin-bottom: 20px;">
        <label style="font-weight: bold; display: block; margin-bottom: 10px;">Comments (Optional)</label>
        {{ form.comment }}
        <style>
          textarea {
            width: 100%; padding: 10px; border: 2px solid #ccc; border-radius: 8px; font-size: 1rem;
          }
          textarea:focus { border-color: #0078D7; outline: none; }
        </style>
      </div>

      <div style="text-align: center; gap: 10px; display: flex;">
        <button type="submit" style="flex: 1; background: #0078D7; color: white; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">
          Submit Review
        </button>
        <a href="{% url 'my_bookings' %}" style="flex: 1; background: #ccc; color: #333; padding: 12px; border-radius: 8px; text-decoration: none; text-align: center; font-weight: bold;">
          Cancel
        </a>
      </div>
    </form>
  </div>
</section>

{% endblock %}
