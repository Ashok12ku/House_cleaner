{% extends 'base.html' %}
{% block content %}

<!-- Page Background -->
<section style="min-height: 100vh; display: flex; justify-content: center; align-items: center;
                background: linear-gradient(135deg, #0078D7, #00B4D8); padding: 40px;">

  <!-- Payment Card -->
  <div style="background: #fff; border-radius: 20px; padding: 40px; max-width: 550px; width: 100%; 
              box-shadow: 0 10px 25px rgba(0,0,0,0.25); text-align: center; border: 3px solid #0078D7;">

    <!-- Payment Icon -->
    <div style="width: 110px; height: 110px; margin: 0 auto 20px; background: #E6F4FF; 
                border: 4px solid #0078D7; border-radius: 50%; display: flex; 
                justify-content: center; align-items: center; animation: pop 0.6s ease;">
        <span style="font-size: 3rem; color: #0078D7;">💳</span>
    </div>

    <!-- Title -->
    <h2 style="color: #0078D7; font-weight: bold;">Pay for {{ booking.service.name }}</h2>

    <!-- Booking Info -->
    <div style="background:#f9f9f9; border:2px dashed #0078D7; border-radius:12px; padding:20px; margin:25px 0;">
      <p style="font-size:1.1rem; color:#333; margin:5px 0;"><strong>Service:</strong> {{ booking.service.name }}</p>
      <p style="font-size:1.1rem; color:#333; margin:5px 0;"><strong>Amount:</strong> ₹{{ amount }}</p>
      <p style="font-size:0.95rem; color:#666;">Please complete your payment to confirm your booking.</p>
    </div>

    <!-- Razorpay Form -->
    <form action="/bookings/payment-success/" method="POST" style="margin-top: 20px;">
        {% csrf_token %}
        <script
            src="https://checkout.razorpay.com/v1/checkout.js"
            data-key="{{ cashfree_key }}"
            data-amount="{{ amount }}"
            data-currency="INR"
            data-order_id="{{ payment_data.order_id }}"
            data-buttontext="💰 Pay ₹{{ amount }}"
            data-name="House Cleaner App"
            data-description="Payment for {{ booking.service.name }}"
            data-theme.color="#0078D7">
        </script>
    </form>

    <!-- Safe Payment Text -->
    <p style="color:#888; font-size:0.9rem; margin-top:20px;">🔒 100% Secure Payment via Cashfree</p>
  </div>
</section>

<!-- Extra CSS for hover & animation -->
<style>
  div[style*="max-width: 550px"]:hover {
      transform: translateY(-5px);
      transition: 0.3s ease;
      box-shadow: 0 15px 30px rgba(0, 120, 215, 0.4);
  }

  @keyframes pop {
      0% { transform: scale(0.6); opacity: 0; }
      70% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); }
  }
</style>

{% endblock %}
