{% extends 'base.html' %}
{% block content %}

<!-- Full Page Centered Layout -->
<section style="min-height: 100vh; display: flex; justify-content: center; align-items: center; background: linear-gradient(135deg, #0078D7, #00B4D8); padding: 40px;">

  <!-- Success Card -->
  <div style="background: #fff; border-radius: 20px; padding: 40px; max-width: 600px; width: 100%; text-align: center; 
              box-shadow: 0 10px 25px rgba(0,0,0,0.25); border: 3px solid #0078D7;">

    <!-- Success Icon -->
    <div style="width: 110px; height: 110px; margin: 0 auto 20px; background: #E6F4FF; border: 4px solid #0078D7; border-radius: 50%;
                display: flex; justify-content: center; align-items: center; animation: pop 0.6s ease;">
        <span style="font-size: 3rem; color: #0078D7;">💳</span>
    </div>

    <!-- Title & Message -->
    <h2 style="color: #0078D7; font-weight: bold;">Payment Successful!</h2>
    <p style="color: #444; font-size: 1.1rem; margin-top: 10px;">
      Thank you for your booking! Your payment has been verified successfully. 🎉
    </p>

    <!-- Divider -->
    <hr style="border: none; border-top: 2px solid #0078D7; width: 60px; margin: 25px auto;">

    <!-- Buttons -->
    <div style="margin-top: 20px;">
      <a href="/bookings/invoice/" 
         style="display:inline-block; background:#0078D7; color:white; padding:12px 30px; border-radius:10px; 
                text-decoration:none; font-weight:bold; transition:all 0.3s ease;">
         ⬇️ Download Invoice (PDF)
      </a>

      <br><br>

      <a href="/bookings/my-bookings/" 
         style="display:inline-block; color:#0078D7; font-weight:600; text-decoration:none; 
                transition:all 0.3s ease;">
         📋 View My Bookings
      </a>
    </div>
  </div>
</section>

<!-- Hover and Animation Styles -->
<style>
  /* Button Hover Effect */
  a[href="/bookings/invoice/"]:hover {
      background: white !important;
      color: #0078D7 !important;
      border: 2px solid #0078D7 !important;
      transform: scale(1.05);
  }

  /* Card Hover Effect */
  div[style*="max-width: 600px"]:hover {
      transform: translateY(-5px);
      transition: 0.3s ease;
      box-shadow: 0 15px 30px rgba(0, 120, 215, 0.4);
  }

  /* Icon Pop Animation */
  @keyframes pop {
      0% { transform: scale(0.6); opacity: 0; }
      70% { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); }
  }
</style>

{% endblock %}
